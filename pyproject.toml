[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "forensic-maldoc-plugin"
version = "0.3.0"
description = "Local, evidence-first PDF and OLE triage for analysts and AI assistants"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["olefile==0.47"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
forensic-maldoc = "forensic_maldoc.cli:main"

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/forensic_maldoc"]

[tool.ruff]
target-version = "py311"
line-length = 100
